<section class="posts-wrapper">
  <header class="section-header">
    <p class="eyebrow">Dernières publications</p>
    <h2>Posts du service</h2>
    <p class="lead">
      Utilisez l'accordéon Bootstrap pour explorer le contenu de chaque post.
    </p>
  </header>

  <div class="accordion" id="postsAccordion">
    <div class="accordion-item" *ngFor="let post of posts; index as i">
      <h2 class="accordion-header" [id]="'heading' + i">
        <button
          class="accordion-button"
          [class.collapsed]="i !== 0"
          type="button"
          data-bs-toggle="collapse"
          [attr.data-bs-target]="'#collapse' + i"
          [attr.aria-expanded]="i === 0 ? 'true' : 'false'"
          [attr.aria-controls]="'collapse' + i"
        >
          {{ post.titre }}
        </button>
      </h2>
      <div
        [id]="'collapse' + i"
        class="accordion-collapse collapse"
        [class.show]="i === 0"
        [attr.aria-labelledby]="'heading' + i"
        data-bs-parent="#postsAccordion"
      >
        <div class="accordion-body">
          <app-post-item [post]="post"></app-post-item>
        </div>
      </div>
    </div>
  </div>
</section>
